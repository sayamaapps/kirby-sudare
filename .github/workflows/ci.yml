name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # Fork guard: a pull request from a fork runs with the fork's code but in
    # this repository's context. This workflow needs no secrets, yet the guard
    # keeps the setup identical across the sayamaapps plugin family.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dev dependencies (Kirby as fixture)
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests
        run: sh tests/run.sh

      - name: The check CLI exits 1 in a project without a configuration (not protected)
        run: |
          set +e
          bin/sudare-check "$RUNNER_TEMP"
          status=$?
          set -e
          [ "$status" = "1" ] || { echo "::error::expected exit 1 without a configuration, got $status"; exit 1; }

      - name: The hash CLI works in a pipe and prints a config file
        run: |
          printf 'ci-only-password\n' | bin/sudare-hash --user=ci > "$RUNNER_TEMP/sudare.php"
          php -l "$RUNNER_TEMP/sudare.php"
          php -r '$c = require $argv[1]; exit(password_verify("ci-only-password", $c["hash"]) && $c["user"] === "ci" ? 0 : 1);' "$RUNNER_TEMP/sudare.php"

  # Kirby 6 is a pre-release. This job runs the same tests against it so the
  # next major shows up early. It never fails the workflow, and Kirby 6 is
  # required only inside the job: composer.json and the tags stay on Kirby 5,
  # so nothing changes for a site that installs this plugin.
  kirby-6:
    name: Kirby 6 pre-release, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Kirby 6 supports PHP 8.3 to 8.5.
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      # platform.php resolves the dependencies for PHP 8.2, which Kirby 6 no
      # longer supports. ^6.0@beta installs the newest Kirby 6 release: a beta
      # or release candidate until the stable version is out.
      - name: Install dev dependencies with Kirby 6
        run: |
          composer config --unset platform.php
          composer require --dev 'getkirby/cms:^6.0@beta' --with-all-dependencies --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-gd

      - name: Tests
        run: sh tests/run.sh
